<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>{{ title }}</title>
    <style>
      body { font-family: "DejaVu Serif", Georgia, serif; font-size: 12pt; line-height: 1.5; margin: 2.5cm 2cm; color: #111; }
      h1 { font-size: 16pt; text-align: center; margin-bottom: 1.2em; }
      h2 { font-size: 13pt; margin-top: 1.4em; }
      p { text-align: justify; margin: 0 0 0.8em; }
      .rodape { margin-top: 3em; font-size: 9pt; color: #666; text-align: center; }
    </style>
  </head>
  <body>
    {{ body }}
    <div class="rodape">{{ title }} &middot; versão {{ version }}</div>
  </body>
</html>
