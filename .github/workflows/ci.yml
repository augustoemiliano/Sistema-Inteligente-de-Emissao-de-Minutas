name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-e-testes:
    name: Lint + testes (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check app
      - name: Black
        run: black --check app
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest -q

  postgres:
    name: Migrações + testes (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minutas_db
          POSTGRES_USER: minutas
          POSTGRES_PASSWORD: minutas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minutas -d minutas_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-with-at-least-32-characters!!
      DATABASE_URL: postgresql+psycopg://minutas:minutas@localhost:5432/minutas_db
      DATABASE_URL_SYNC: postgresql+psycopg2://minutas:minutas@localhost:5432/minutas_db
      TEST_DATABASE_URL: postgresql+psycopg://minutas:minutas@localhost:5432/minutas_db
      TEST_DATABASE_URL_SYNC: postgresql+psycopg2://minutas:minutas@localhost:5432/minutas_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Alembic upgrade / check / downgrade
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Seed de demonstração (idempotente)
        run: |
          python -m app.scripts.seed
          python -m app.scripts.seed
      - name: Pytest contra PostgreSQL
        run: pytest -q
